<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;800&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
<style>

.bar{height:5px;background:#ffffff18;border-radius:3px;margin-top:5px}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--b),var(--c),var(--v));border-radius:3px;transition:width .5s}

.btn,.g{cursor:pointer;border:0;border-radius:6px;font-weight:800;color:#041018}.btn{background:linear-gradient(90deg,var(--c),var(--b));padding:12px 22px;font-size:14px}.btn:disabled{opacity:.4;cursor:not-allowed}.btn.big{font-size:18px;padding:16px 34px}

@keyframes gl{0%,92%,100%{transform:none}93%{transform:translate(4px,-1px) skewX(6deg)}95%{transform:translate(-4px,1px)}97%{transform:translate(2px,0) skewX(-4deg)}}

.tl{display:flex;justify-content:space-between;margin:28px 0;position:relative}.tl::before{content:"";position:absolute;left:5%;right:5%;top:11px;height:2px;background:linear-gradient(90deg,var(--b),var(--v))}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-bottom:26px}.roles{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:12px 0}.roles div{border:1px solid #a855f755;border-radius:6px;padding:6px 10px}.roles b{color:var(--v)}
ul{margin:0;padding-left:20px}input[type=text],input:not([type]),textarea{width:100%;background:#050914;color:var(--t);border:1px solid #22e4ff55;border-radius:6px;padding:10px;font:inherit}textarea{resize:vertical;margin-bottom:8px}
.lv{display:grid;grid-template-columns:1fr 300px;gap:18px}.tag{color:var(--v);font-size:13px;margin-bottom:10px}.fb{min-height:28px;margin-top:10px;font-weight:700}.row{display:flex;gap:10px;margin-top:12px}

.h{display:block;width:34px;height:20px;border-radius:4px;background:#f4ead0;border:1px dashed #b49b55}.h.p{background:#0a0f26;border:1px solid #000;cursor:pointer}.h.m{background:var(--c);box-shadow:0 0 10px var(--c)}em{height:20px;line-height:20px;font-style:normal;font-weight:700}
.tbl{display:flex;flex-wrap:wrap;gap:4px 10px;margin-top:12px;font-size:14px;color:var(--m)}
.win{background:#c0c0c0;border:2px outset #fff;color:#000;font-family:"Times New Roman",serif}.tb{background:#000080;color:#fff;padding:3px 8px;font:12px Arial}.pg{background:#fff;padding:16px;margin:4px}.pg .btn{font:14px Arial;background:#c0c0c0;border:2px outset #fff;color:#000;border-radius:0}.pg pre{background:#111;color:#0f0}
.phone{max-width:300px;margin:0 auto;background:#fff;color:#222;border-radius:26px;border:6px solid #222;padding:18px}.phone h3{color:#e8590c;font-size:20px}.phone .r{padding:10px;border-radius:8px;background:#f1f3f5;margin:8px 0;cursor:pointer;font-size:15px}.phone .tiny{font-size:10px;color:#999}.phone .big{width:100%;padding:16px;border:0;border-radius:40px;background:#e8590c;color:#fff;font-weight:800}.phone .trap{outline:3px solid var(--bad);background:#ffe3e3}
.shake{animation:sk .3s}@keyframes sk{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.chat{display:grid;gap:10px}.m{padding:10px 14px;border-radius:14px;max-width:85%}.m.u{background:#3b6bff55;justify-self:end}.m.a{background:#a855f733;border:1px solid #a855f777;cursor:pointer}.m.a.sel{border-color:var(--c);box-shadow:0 0 14px var(--c)}
.flow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;margin:10px 0}.nd{border:1px solid var(--c);border-radius:6px;padding:10px 14px}.op{color:var(--bad);font-family:Orbitron;font-size:22px;animation:bl 1s infinite}
.ring{width:110px;height:110px;margin:0 auto 14px;border-radius:50%;display:grid;place-items:center;font-size:44px;color:var(--ok);border:3px solid var(--ok);box-shadow:0 0 30px var(--ok),inset 0 0 20px #2dff9a55;animation:pu 1.6s infinite}@keyframes pu{50%{transform:scale(1.08)}}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0}.stats div{background:#ffffff0d;border-radius:8px;padding:10px}.stats b{display:block;font:800 22px Orbitron;color:var(--c)}
.lb{max-width:560px;margin:14px auto;text-align:left}.lb div{display:grid;grid-template-columns:40px 1fr 70px;padding:7px 12px;border-left:3px solid transparent;color:var(--m)}.lb .fin{border-color:var(--c);color:var(--t)}.lb .me{background:#a855f733;color:#fff}.lb .cut{border-top:1px dashed var(--bad);padding:0;height:0}
.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:22px 0}.pc{cursor:pointer;color:var(--t);text-align:left;font:inherit}.pc.sel{border-color:var(--c);box-shadow:0 0 22px var(--c)}
.site{background:#fff;color:#223;border-radius:8px;overflow:hidden;min-height:200px;font-family:system-ui}.site .hero{padding:22px;background:linear-gradient(135deg,#ff5fd2,#ffb454);color:#fff}.site .hero h2{font-size:24px}.site section{padding:10px 18px}.site h4{margin:0;color:#a0398a}
.capsule{display:flex;justify-content:center;margin:26px 0;filter:drop-shadow(0 0 22px var(--c))}.capsule i{width:70px;height:110px;background:linear-gradient(var(--c),var(--v));border-radius:70px 0 0 70px;animation:l 1.6s forwards}.capsule i+i{border-radius:0 70px 70px 0;animation-name:r}@keyframes l{from{transform:translateX(-90px)}}@keyframes r{from{transform:translateX(90px)}}
.awards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}.awards div{background:#ffffff0d;border-radius:8px;padding:12px}.awards b{display:block;font:800 18px Orbitron;color:var(--c)}.ok{color:var(--ok);font-weight:700}
@media(max-width:800px){.lv,.grid2{grid-template-columns:1fr}.cards,.stats,.awards{grid-template-columns:1fr 1fr}#hud{grid-template-columns:1fr 1fr}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style></head><body>
<header id="hud"><div class="o" style="color:var(--c)">{/} CODEBREAKERS</div><div><b id="hl"></b><div class="bar"><i id="pg"></i></div></div><div>TEAM <b id="tn"></b> <span class="sm" id="ti"></span></div><div class="o" id="tm">--:--</div><div>SCORE <b id="sc">0</b></div><button class="g" id="sk" onclick="skip()">Skip level</button></header>
<main id="app"></main>
<script>
const $=s=>document.querySelector(s),A=$('#app'),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const S={team:'',id:'',sc:[0,0],hints:0,bonus:0,secs:0,quick:true,i:0,h:0,left:0,full:0,tid:0,p:-1,v:{}};
const mm=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),total=()=>S.sc[0]+S.sc[1]+S.bonus;
const fb=(m,g)=>{const f=$('#fb');if(f){f.textContent=m;f.style.color=g?'var(--ok)':'var(--bad)'}};
function hud(l,p,sk){$('#hud').style.display='grid';$('#hl').textContent=l;$('#pg').style.width=p+'%';$('#tn').textContent=S.team;$('#ti').textContent=S.id;$('#sc').textContent=total();$('#sk').hidden=!sk;$('#tm').textContent='--:--'}
const mcq=(b,q,o,c,ok)=>{b.innerHTML=`<div class=card>${q}</div><div class=opts>${o.map((t,k)=>`<button class=opt data-k=${k}>${t}</button>`).join('')}</div>`;b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(+x.dataset.k===c){x.classList.add('good');fb('Correct! Timeline repaired.',1);ok()}else{x.classList.add('bad');fb('Not quite. Try another option.',0)}})};
const chk=(b,a,ok)=>{const i=b.querySelector('#ans'),g=()=>{if(i.value.trim().toUpperCase()===a){fb('Code accepted!',1);ok()}else fb('That code doesn’t work. Check it again.',0)};b.querySelector('#go').onclick=g;i.onkeydown=e=>e.key==='Enter'&&g()};
const LV=[
{r:1,n:'The Punch Card',p:25,m:'The first computer systems communicated through patterns. Decode the hidden four-letter word.',h:['Each column is one letter. Tap the holes in a column to add up their values.','Holes worth 16 and 4 add up to 20, and the table says T=20.'],f(b,ok){const W=[16,8,4,2,1];b.innerHTML=`<div class=card><div class=cols><div class=col>${W.map(x=>`<em>${x}</em>`).join('')}</div>${[...'TIME'].map(c=>{const n=c.charCodeAt(0)-64;return`<div class=col>${W.map(x=>`<i class="h${n&x?' p':''}" data-w=${x}></i>`).join('')}<b>0</b></div>`}).join('')}</div><div class=tbl>${[...'ABCDEFGHIJKLMNOPQRSTUVWXYZ'].map((c,k)=>`<span>${c}=${k+1}</span>`).join('')}</div></div><div class=row><input id=ans placeholder="Four-letter word" maxlength=4><button class=btn id=go>Decode</button></div>`;b.querySelectorAll('.h.p').forEach(h=>h.onclick=()=>{h.classList.toggle('m');const c=h.parentElement;c.querySelector('b').textContent=[...c.querySelectorAll('.h.m')].reduce((a,x)=>a+ +x.dataset.w,0)});chk(b,'TIME',ok)}},
{r:1,n:'The Early Internet',p:25,m:'A hidden code has been planted in this webpage. Find it using View Source.',h:['Click View Source and look for the highlighted lines.','The code is written after “code:” in the second highlighted line.'],f(b,ok){b.innerHTML=`<div class=win><div class=tb>NetSurf 95 — http://www.geocities-1996.net/~cool</div><div class=pg><h2 style="color:#00f;font-family:inherit">★ Welcome to MY HOMEPAGE ★</h2><p>You are visitor number <u>004217</u>. This site is under construction.</p><p><u>Guestbook</u> | <u>Links</u></p><button class=btn id=vs>View Source</button><pre id=src hidden>&lt;html&gt;\n  &lt;h1&gt;Welcome to MY HOMEPAGE&lt;/h1&gt;\n<mark>&lt;!-- Look here: the secret code is in the next line --&gt;\n&lt;!-- code: WEB95 --&gt;</mark>\n  &lt;p&gt;Under construction&lt;/p&gt;\n&lt;/html&gt;</pre></div></div><div class=row><input id=ans placeholder="Hidden code"><button class=btn id=go>Submit code</button></div>`;$('#vs').onclick=()=>$('#src').hidden=false;chk(b,'WEB95',ok)}},
{r:1,n:'The Mobile Era',p:25,m:'This app contains two hidden traps. Tap the suspicious elements before the timeline becomes corrupted.',h:['One trap asks for far more access than a torch needs.','The other hides a price in tiny text.'],f(b,ok){let n=0;b.innerHTML=`<div class=phone><h3>◉ FlashLite</h3><p class=sm>The #1 free torch app</p><button class=big data-s>TURN ON TORCH</button><div class=r data-s>Brightness <input type=range></div><div class=r data-t="Asks for too many permissions">☑ Allow FlashLite to read your contacts and messages</div><div class="r tiny" data-t="Hidden fee in tiny text">Free for 3 days, then $49.99 per week. Auto-renews.</div><div class=r data-s>★★★★★ Rate us</div></div>`;b.querySelectorAll('[data-t],[data-s]').forEach(e=>e.onclick=()=>{if(e.dataset.t){if(!e.classList.contains('trap')){e.classList.add('trap');n++;fb(`Trap found: ${e.dataset.t} (${n}/2)`,1);if(n==2)ok()}}else{e.classList.add('shake');setTimeout(()=>e.classList.remove('shake'),400);fb('That looks harmless.',0)}})}},
{r:1,n:'The AI Era',p:25,m:'AI can sound confident even when it is wrong. Identify the false statement.',h:['Think about which came first: touchscreens or the internet.','Statement 2 is the odd one out.'],f(b,ok){const L=['The first website went online in 1991.','Touchscreen smartphones existed before the internet was invented.','AI chatbots can give wrong answers with great confidence.'];let s=-1;b.innerHTML=`<div class=chat><div class="m u">Tell me three facts about technology.</div>${L.map((t,k)=>`<div class="m a" data-k=${k}>${t}</div>`).join('')}</div><div class=row><button class=btn id=go>Flag the false statement</button></div>`;b.querySelectorAll('.a').forEach(e=>e.onclick=()=>{b.querySelectorAll('.a').forEach(x=>x.classList.remove('sel'));e.classList.add('sel');s=+e.dataset.k});$('#go').onclick=()=>{if(s<0)return fb('Select a statement first.',0);if(s==1){fb('Correct. The AI was confidently wrong!',1);ok()}else fb('That one is true. Look again.',0)}}},
{r:1,b:1,n:'Bonus',p:10,m:'Optional bonus (10 points): one harder question.',h:[],f(b,ok){mcq(b,'In binary, what does 101 equal in decimal?',['3','5','7'],1,ok)}},
{r:2,n:'Code Paradox',p:33,m:'This code should print 10 but does not. Choose the fix.',h:['The loop should add each number to the running total.','Look at the line inside the loop.'],f(b,ok){mcq(b,'<pre class=code>total = 0\nfor i in range(1, 5):\n    total = i\nprint(total)   # should print 10</pre>Which line fixes the bug?',['total += i','total = total + 1','print(i)'],0,ok)}},
{r:2,n:'Logic Paradox',p:33,m:'The login rule is broken. Replace the wrong word in the flowchart.',h:['The rule says both checks must pass.','Which operator needs both sides to be true?'],f(b,ok){b.innerHTML=`<div class=card><div class=flow><span class=nd>START</span>→<span class=nd>Password correct? <b class=op id=op>OR</b> OTP correct?</span>→<span class=nd>LOGIN ALLOWED</span></div><p>Rule: a user may log in only if <u>both</u> checks pass.</p></div><div class=opts>${['AND','NOT','XOR'].map(t=>`<button class=opt>${t}</button>`).join('')}</div>`;b.querySelectorAll('.opt').forEach(x=>x.onclick=()=>{if(x.textContent=='AND'){$('#op').textContent='AND';$('#op').style.animation='none';x.classList.add('good');fb('Logic repaired!',1);ok()}else{x.classList.add('bad');fb('That would still let the wrong people in.',0)}})}},
{r:2,n:'Fact Paradox',p:34,m:'An AI gave a wrong answer. Verify it and choose the correct fact.',h:['Search for “first iPhone release year”.','It was not the 1990s or the 2010s.'],f(b,ok){mcq(b,'<div class=chat><div class="m a">The first iPhone launched in 2001 and changed mobile technology forever.</div></div><p>Which launch year is correct?</p>',['2007','1999','2015'],0,ok)}},
{r:2,b:1,n:'Bonus',p:10,m:'Optional bonus (10 points): one harder question.',h:[],f(b,ok){mcq(b,'Which logic gate outputs true only when both inputs are true?',['OR','AND','NOT'],1,ok)}}];
const dur=i=>{const L=LV[i];return S.quick?(L.b?20:45):(L.b?60:L.r==1?300:400)};
function go(i){S.i=i;S.h=0;S.solved=0;const L=LV[i];document.body.classList.remove('r3');clearInterval(S.tid);S.full=S.left=dur(i);
A.innerHTML=`<div class=lv><div><div class="o tag">${L.b?'BONUS QUESTION':'ROUND '+L.r+' · '+L.n.toUpperCase()}</div><div id=st></div><div id=fb class=fb></div></div><aside class=card><h3>MISSION</h3><p>${L.m}</p>${L.b?'<button class=g onclick=nxt()>Skip bonus</button>':'<button class=g id=hb>Hint (free)</button><p class=sm>First hint is free. Each extra hint costs 3 points.</p>'}<div id=hints></div></aside></div>`;
L.f($('#st'),solve);if($('#hb'))$('#hb').onclick=hint;
hud(L.b?`ROUND ${L.r} · BONUS`:`ROUND ${L.r} · LEVEL ${L.r==1?i+1:i-4} OF ${L.r==1?4:3}`,i/9*100,1);$('#tm').textContent=mm(S.left);S.tid=setInterval(tick,1000)}
function hint(){const L=LV[S.i];S.h++;S.hints++;$('#hints').innerHTML+=`<p class=sm>💡 ${L.h[Math.min(S.h-1,L.h.length-1)]}</p>`;$('#hb').textContent='Hint (−3 points)'}
function tick(){S.left--;$('#tm').textContent=mm(Math.max(S.left,0));if(S.left<=0){clearInterval(S.tid);S.secs+=S.full;S.solved=1;fb('Time’s up! The timeline moves on…',0);setTimeout(nxt,1300)}}
function solve(){if(S.solved)return;S.solved=1;clearInterval(S.tid);const L=LV[S.i],p=L.b?10:Math.max(0,L.p-3*Math.max(0,S.h-1));L.b?S.bonus+=p:S.sc[L.r-1]+=p;S.secs+=S.full-S.left;$('#sc').textContent=total();fb(`+${p} points!`,1);setTimeout(nxt,1200)}
function nxt(){clearInterval(S.tid);S.i==4?sum1():S.i==8?sum2():go(S.i+1)}
function skip(){S.secs+=S.full-S.left;nxt()}
const st=(a,b)=>`<div>${a}<b>${b}</b></div>`;
function sum1(){hud('ROUND 1 COMPLETE',50,0);A.innerHTML=`<div class="card center"><div class=ring>✓</div><h2 class=glitch>TIMELINE STABILISED</h2><div class=stats>${st('Round 1 score',S.sc[0]+'/100')}${st('Time taken',mm(S.secs))}${st('Hints used',S.hints)}${st('Bonus points',S.bonus)}</div><button class="btn big" onclick=go(5)>Enter Round 2</button></div>`}
const TEAMS=[['Byte Me',188],['Stack Overflowers',176],['Quantum Quokkas',171],['Syntax Heroes',165],['Pixel Pirates',158],['Null Pointers',149],['Loop Hole',141],['Git Gud',133],['Ctrl Alt Elite',118]];
function sum2(){hud('ROUND 2 COMPLETE',60,0);const b=[...TEAMS.map(t=>({n:t[0],s:t[1]})),{n:S.team+' (you)',s:total(),me:1}].sort((a,b)=>b.s-a.s);
A.innerHTML=`<div class="card center"><div class=ring>✓</div><h2>COMBINED SCORE: <span style="color:var(--c)">${total()}</span></h2><p class=sm>Round 1: ${S.sc[0]} · Round 2: ${S.sc[1]} · Bonus: ${S.bonus}</p><div class=lb>${b.map((t,k)=>`<div class="${k<8?'fin':''} ${t.me?'me':''}"><span>#${k+1}</span><span>${esc(t.n)}</span><b>${t.s}</b></div>${k==7?'<div class=cut></div>':''}`).join('')}</div><p class=sm>Top 8 advance to the final. Sample leaderboard; in this demo every player continues.</p><h2 class=glitch style="margin:16px 0">YOU HAVE REPAIRED THE TIMELINE.<br>BUT CAN YOU BUILD THE FUTURE?</h2><button class="btn big" onclick=r3a()>Enter Round 3</button></div>`}
const PROB=[['Identity','Your phone is your only identity document. What technology would make this safe, accessible and reliable?'],['Traffic','Cities need to reduce traffic and make travel stress-free.'],['Learning','Every student needs a personalised way to learn.'],['Language','People need to communicate across language barriers.']];
const r3d=()=>S.quick?180:3600;
function r3a(){document.body.classList.add('r3');clearInterval(S.tid);hud('ROUND 3 · TIME CAPSULE',66,0);$('#tm').textContent=mm(r3d());S.p=-1;
